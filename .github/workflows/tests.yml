name: Tests & Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  quality:
    name: Static analysis & code style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, redis, bcmath, pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse --error-format=github

  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [10, 11, 12, 13]
        include:
          - laravel: 10
            testbench: 8
          - laravel: 11
            testbench: 9
          - laravel: 12
            testbench: 10
          - laravel: 13
            testbench: 11
        exclude:
          # Laravel 13 (testbench 11) requires PHP >= 8.3
          - php: '8.2'
            laravel: 13
          # Laravel 10 supports PHP up to 8.3
          - php: '8.4'
            laravel: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, redis, bcmath, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        run: |
          composer require --dev "orchestra/testbench:^${{ matrix.testbench }}.0" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Execute Pest tests
        run: vendor/bin/pest
